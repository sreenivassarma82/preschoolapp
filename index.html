<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#71bf1b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Little Wings Preschool</title><script src="bootstrap.js?v=r24"></script><link rel="stylesheet" href="style.css?v=r24"></head><body><aside><div class="brand"><img class="app-logo" src="assets/little-wings-logo.jpg" alt="Little Wings Preschool"><span>Little Wings Preschool</span></div><p class="app-subtitle">Administrator app</p><nav id="nav" aria-label="Primary modules"></nav><div class="aside-note">One academic year at a time.<br>Every record in one place.</div></aside><main><header><div><label for="year">Academic year</label><select id="year"></select></div><div><label for="branch">Branch</label><select id="branch"></select></div><div><label for="topClass">Class</label><select id="topClass"></select></div><div class="header-actions"><button type="button" id="appBack" aria-label="Go back to previous app page">← Back</button><button type="button" id="appHome" aria-label="Go to Students Overview">Home</button><span id="appVersion">Version r24</span><span id="storageStatus">Saved in this browser</span><button id="export">Download Excel</button><button id="installApp" hidden>Install app</button><button class="primary" id="add">+ Add student</button></div></header><p id="filterScope" class="setting-note" hidden></p><div id="pwaStatus" role="status" aria-live="polite" hidden></div><div id="notice" role="status" aria-live="polite"></div><nav id="subnav" class="subnav" aria-label="Module sections"></nav><section id="view"></section></main><dialog id="editor"><form id="studentForm" novalidate><div class="dialog-head"><h2 id="editorTitle">Student admission</h2><button type="button" id="closeEditor" aria-label="Close">✕</button></div><div id="admissionNotice" role="alert" aria-live="assertive" tabindex="-1" hidden></div><div id="fields"></div><footer><div id="admissionFeedback" role="status" aria-live="polite" hidden></div><button type="button" id="cancelEditor">Cancel</button><button class="primary" id="saveAdmissionButton" type="button" onclick="if(window.ledgerSaveClick){window.ledgerSaveClick()}else{alert('App files did not load. Refresh online using the latest app link.')};">Save admission</button></footer></form></dialog><dialog id="paymentDialog"><form id="paymentForm"><h2>Record payment</h2><label>Student<select name="student" required></select></label><div class="grid"><label>Payment date<input type="date" name="date" required></label><label>Amount<input type="number" min="0.01" step="0.01" name="amount" required></label><label>Method<select name="method"><option>Cash</option><option>Bank transfer</option><option>UPI</option><option>Cheque</option><option>Other</option></select></label><label>Receipt / reference<input name="reference" maxlength="100"></label></div><label>Notes<input name="notes" maxlength="500"></label><footer><button type="button" id="cancelPayment">Cancel</button><button class="primary">Save payment</button></footer></form></dialog><dialog id="cloudFolderPicker" aria-labelledby="cloudFolderTitle"><div class="dialog-head"><h2 id="cloudFolderTitle">Choose OneDrive folder</h2><button type="button" id="closeCloudFolderPicker" aria-label="Close folder browser">✕</button></div><p class="setting-note">Open a folder, then choose “Use this folder”. Select a dedicated folder for your preschool records.</p><form id="sharedFolderForm" class="inline"><label>Shared OneDrive folder link<input name="link" type="url" required placeholder="Paste the folder link shared with you"></label><button type="submit">Open shared folder</button></form><nav id="cloudFolderBreadcrumbs" aria-label="OneDrive folder location"></nav><div id="cloudFolderNotice" role="status" aria-live="polite"></div><div id="cloudFolderList"></div><form id="cloudNewFolderForm" class="inline"><label>New folder name<input name="folderName" required maxlength="200" placeholder="e.g. Student Records"></label><button type="submit">Create folder</button></form><footer><button type="button" id="cancelCloudFolderPicker">Cancel</button><button type="button" class="primary" id="useCloudFolder" disabled>Use this folder</button></footer></dialog><script src="excel.js?v=r24"></script><script src="cloud.js?v=r24"></script><script src="history.js?v=r24"></script><script src="admin.js?v=r24"></script><script src="admin-ui.js?v=r24"></script><script src="performance.js?v=r24"></script><script src="performance-ui.js?v=r24"></script><script src="marksheet-export.js?v=r24"></script><script src="school-documents.js?v=r24"></script><script src="navigation.js?v=r24"></script><script src="admissions.js?v=r24"></script><script src="app.js?v=r24"></script><script src="pwa.js?v=r24"></script></body></html>
