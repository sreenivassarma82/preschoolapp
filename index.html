<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#142943"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Little wings preschool ledger</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="brand">▦ <span>Little wings preschool ledger</span></div><p>PRE-SCHOOL RECORDS</p><nav id="nav"><button data-tab="summary">Overview</button><button data-tab="students">Students</button><button data-tab="parents">Parents & contacts</button><button data-tab="fees">Fees & payments</button><button data-tab="reports">Reports</button><button data-tab="settings">Year & storage settings</button></nav><div class="aside-note">One academic year at a time.<br>Every record in one place.</div></aside><main><header><div><label for="year">Academic year</label><select id="year"></select></div><div class="header-actions"><span id="storageStatus">Saved in this browser</span><button id="export">Download Excel</button><button id="installApp" hidden>Install app</button><button class="primary" id="add">+ Add student</button></div></header><div id="pwaStatus" role="status" aria-live="polite" hidden></div><div id="notice" role="status" aria-live="polite"></div><section id="view"></section></main><dialog id="editor"><form id="studentForm"><div class="dialog-head"><h2 id="editorTitle">Student admission</h2><button type="button" id="closeEditor" aria-label="Close">✕</button></div><div id="fields"></div><footer><button type="button" id="cancelEditor">Cancel</button><button class="primary">Save admission</button></footer></form></dialog><dialog id="paymentDialog"><form id="paymentForm"><h2>Record payment</h2><label>Student<select name="student" required></select></label><div class="grid"><label>Payment date<input type="date" name="date" required></label><label>Amount<input type="number" min="0.01" step="0.01" name="amount" required></label><label>Method<select name="method"><option>Cash</option><option>Bank transfer</option><option>UPI</option><option>Cheque</option><option>Other</option></select></label><label>Receipt / reference<input name="reference" maxlength="100"></label></div><label>Notes<input name="notes" maxlength="500"></label><footer><button type="button" id="cancelPayment">Cancel</button><button class="primary">Save payment</button></footer></form></dialog><dialog id="cloudFolderPicker" aria-labelledby="cloudFolderTitle"><div class="dialog-head"><h2 id="cloudFolderTitle">Choose OneDrive folder</h2><button type="button" id="closeCloudFolderPicker" aria-label="Close folder browser">✕</button></div><p class="setting-note">Open a folder, then choose “Use this folder”. Select a dedicated folder for your preschool records.</p><nav id="cloudFolderBreadcrumbs" aria-label="OneDrive folder location"></nav><div id="cloudFolderNotice" role="status" aria-live="polite"></div><div id="cloudFolderList"></div><form id="cloudNewFolderForm" class="inline"><label>New folder name<input name="folderName" required maxlength="200" placeholder="e.g. Student Records"></label><button type="submit">Create folder</button></form><footer><button type="button" id="cancelCloudFolderPicker">Cancel</button><button type="button" class="primary" id="useCloudFolder" disabled>Use this folder</button></footer></dialog><script src="excel.js"></script><script src="cloud.js"></script><script src="app.js"></script><script src="pwa.js"></script></body></html>
